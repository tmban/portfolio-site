<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://*.basemaps.cartocdn.com https://unpkg.com; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>OnBuy · Results</title>
<style>
:root{--blue:#2f6bff;--navy:#0a1640;--bg:#fff;--bg-soft:#f3f6fc;--ink:#0c1330;--muted:#646c92;--muted-2:#a3a9c6;--border:#e4e7f1;--good:#1f9d57;--good-bg:#e7f6ec;--lime:#b9f24e;--sans:'Inter',sans-serif;--head:'Fira Sans',sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;font-family:var(--sans)}
html,body{width:1080px;height:1080px;background:#eef1f7;color:var(--ink);overflow:hidden}
.mg{position:relative;width:100%;height:100%;background:var(--bg-soft);overflow:hidden}
.mg-grid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(12,19,48,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(12,19,48,.03) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(ellipse 80% 70% at 50% 50%,black 30%,transparent 90%)}
.mg-eyebrow{font:600 12px/1 var(--sans);letter-spacing:.15em;text-transform:uppercase;color:var(--blue)}
.mg-title{font:800 52px/1.03 var(--head);letter-spacing:-.03em;color:var(--ink)}
.mg-watermark{position:absolute;left:56px;bottom:52px;display:flex;align-items:center;gap:12px;font:400 13px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mg-watermark .dot{width:8px;height:8px;border-radius:50%;background:var(--blue)}
.mg-watermark strong{color:var(--ink);font-weight:600}
.mg-corner-tag{position:absolute;right:56px;top:56px;font:500 12px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.mg-corner-tag .dt{width:6px;height:6px;background:var(--blue);border-radius:50%}

@keyframes r-filter{0%,18%{background:#eef1f9;color:var(--muted);border-color:var(--border)}26%,100%{background:var(--blue);color:#fff;border-color:var(--blue)}}
@keyframes r-wide{0%,18%{opacity:1}26%,100%{opacity:0}}
@keyframes r-narrow{0%,22%{opacity:0}30%,100%{opacity:1}}
@keyframes r-dropA{0%,30%{opacity:1}38%,100%{opacity:0;transform:scale(.9)}}
@keyframes r-prot{0%,46%{opacity:0;transform:translateY(8px)}56%,100%{opacity:1;transform:none}}
@keyframes r-prot2{0%,54%{opacity:0;transform:translateY(8px)}64%,100%{opacity:1;transform:none}}
@keyframes r-prot3{0%,62%{opacity:0;transform:translateY(8px)}72%,100%{opacity:1;transform:none}}
body:not(.mg-play) *,body:not(.mg-play) *::before,body:not(.mg-play) *::after{animation-name:none !important}
body.mg-play{animation:mg-page-in 700ms cubic-bezier(.2,.6,.2,1) both}
@keyframes mg-page-in{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:scale(1)}}

.rcard{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 12px 28px -18px rgba(12,19,48,.2)}
.rthumb{height:120px;background:#fff;position:relative}
.rthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:12px}
.pname{font:600 13px/1.3 var(--ink);margin:0 0 7px}
.price{font:800 17px/1 var(--head);color:var(--ink)}
.rrow{display:flex;align-items:center;gap:8px;margin-top:9px}
.star{font:600 11px/1 var(--muted)}
.prot{display:inline-flex;align-items:center;gap:5px;font:700 10px/1 var(--sans);color:var(--good);background:var(--good-bg);padding:5px 8px;border-radius:6px}
</style>
<style id="a11y-reduced-motion">@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}</style>
</head>
<body class="mg-play">
<div class="mg">
  <div class="mg-grid"></div>

  <div style="position:absolute;top:64px;left:72px;right:72px">
    <div class="mg-title">Scannable at<br>marketplace scale.</div>
  </div>

  <div style="position:absolute;left:72px;right:72px;top:312px">
    <!-- result count + filter -->
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:20px">
      <div style="position:relative;font:700 22px/1 var(--head);color:var(--ink);min-width:230px">
        <span style="position:absolute;animation:r-wide 10s ease both infinite">12,480 results</span>
        <span style="position:absolute;animation:r-narrow 10s ease both infinite">38 results</span>
      </div>
      <div style="margin-left:auto;display:flex;gap:10px">
        <span style="font:600 13px/1 var(--sans);padding:10px 16px;border-radius:99px;border:1px solid var(--border);animation:r-filter 10s ease both infinite">★ 4.5+ &amp; Protected</span>
        <span style="font:600 13px/1 var(--sans);color:var(--muted);background:#eef1f9;padding:10px 16px;border-radius:99px">Under £100</span>
        <span style="font:600 13px/1 var(--sans);color:var(--muted);background:#eef1f9;padding:10px 16px;border-radius:99px">Prime delivery</span>
      </div>
    </div>
    <!-- grid -->
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:20px">
      <div class="rcard"><div class="rthumb"><img src="../assets/photos/p_headphones.jpg" alt=""></div><div style="padding:14px 15px"><div class="pname">Anker Soundcore Q30</div><div class="price">£59</div><div class="rrow"><span class="star">★ 4.7</span><span class="prot" style="animation:r-prot 10s ease both infinite">✓ Protected</span></div></div></div>
      <div class="rcard"><div class="rthumb"><img src="../assets/photos/p_headphones.jpg" alt=""></div><div style="padding:14px 15px"><div class="pname">JBL Tune 770NC</div><div class="price">£79</div><div class="rrow"><span class="star">★ 4.6</span><span class="prot" style="animation:r-prot2 10s ease both infinite">✓ Protected</span></div></div></div>
      <div class="rcard"><div class="rthumb"><img src="../assets/photos/p_headphones.jpg" alt=""></div><div style="padding:14px 15px"><div class="pname">Sennheiser HD 350</div><div class="price">£89</div><div class="rrow"><span class="star">★ 4.8</span><span class="prot" style="animation:r-prot3 10s ease both infinite">✓ Protected</span></div></div></div>
      <div class="rcard" style="animation:r-dropA 10s ease both infinite"><div class="rthumb"><img src="../assets/photos/p_headphones.jpg" alt=""></div><div style="padding:14px 15px"><div class="pname">Unbranded earbuds</div><div class="price">£12</div><div class="rrow"><span class="star" style="color:var(--muted-2)">★ 3.1</span></div></div></div>
      <div class="rcard" style="animation:r-dropA 10s ease both infinite"><div class="rthumb"><img src="../assets/photos/p_headphones.jpg" alt=""></div><div style="padding:14px 15px"><div class="pname">Generic headset</div><div class="price">£8</div><div class="rrow"><span class="star" style="color:var(--muted-2)">★ 2.9</span></div></div></div>
      <div class="rcard" style="animation:r-dropA 10s ease both infinite"><div class="rthumb"><img src="../assets/photos/p_headphones.jpg" alt=""></div><div style="padding:14px 15px"><div class="pname">No-name buds</div><div class="price">£15</div><div class="rrow"><span class="star" style="color:var(--muted-2)">★ 3.4</span></div></div></div>
    </div>
  </div>

</div>
</body>
</html>
