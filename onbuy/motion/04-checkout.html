<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://*.basemaps.cartocdn.com https://unpkg.com; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>OnBuy · Checkout</title>
<style>
:root{--blue:#2f6bff;--navy:#0a1640;--bg:#fff;--bg-soft:#f3f6fc;--ink:#0c1330;--muted:#646c92;--muted-2:#a3a9c6;--border:#e4e7f1;--good:#1f9d57;--good-bg:#e7f6ec;--sans:'Inter',sans-serif;--head:'Fira Sans',sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;font-family:var(--sans)}
html,body{width:1080px;height:1080px;background:#eef1f7;color:var(--ink);overflow:hidden}
.mg{position:relative;width:100%;height:100%;background:var(--bg-soft);overflow:hidden}
.mg-grid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(12,19,48,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(12,19,48,.03) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(ellipse 80% 70% at 50% 50%,black 30%,transparent 90%)}
.mg-eyebrow{font:600 12px/1 var(--sans);letter-spacing:.15em;text-transform:uppercase;color:var(--blue)}
.mg-title{font:800 52px/1.03 var(--head);letter-spacing:-.03em;color:var(--ink)}
.mg-watermark{position:absolute;left:56px;bottom:52px;display:flex;align-items:center;gap:12px;font:400 13px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mg-watermark .dot{width:8px;height:8px;border-radius:50%;background:var(--blue)}
.mg-watermark strong{color:var(--ink);font-weight:600}
.mg-corner-tag{position:absolute;right:56px;top:56px;font:500 12px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.mg-corner-tag .dt{width:6px;height:6px;background:var(--blue);border-radius:50%}

@keyframes c-row1{0%,16%{opacity:0;transform:translateX(-10px)}24%,100%{opacity:1;transform:none}}
@keyframes c-row2{0%,24%{opacity:0;transform:translateX(-10px)}32%,100%{opacity:1;transform:none}}
@keyframes c-row3{0%,32%{opacity:0;transform:translateX(-10px)}40%,100%{opacity:1;transform:none}}
@keyframes c-total{0%,42%{opacity:0;transform:scale(.96)}50%,100%{opacity:1;transform:none}}
@keyframes c-press{0%,62%{transform:none}66%{transform:scale(.97)}70%,100%{transform:none}}
@keyframes c-done{0%,72%{opacity:0;transform:scale(.9)}80%,100%{opacity:1;transform:none}}
@keyframes c-veil{0%,72%{opacity:0}80%,100%{opacity:1}}
body:not(.mg-play) *,body:not(.mg-play) *::before,body:not(.mg-play) *::after{animation-name:none !important}
body.mg-play{animation:mg-page-in 700ms cubic-bezier(.2,.6,.2,1) both}
@keyframes mg-page-in{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:scale(1)}}

.sumrow{display:flex;justify-content:space-between;font:500 16px/1 var(--muted);padding:11px 0}
.sumrow b{color:var(--ink);font-weight:600}
</style>
<style id="a11y-reduced-motion">@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}</style>
</head>
<body class="mg-play">
<div class="mg">
  <div class="mg-grid"></div>

  <div style="position:absolute;top:64px;left:72px;right:72px">
    <div class="mg-title">Cost up front,<br>before you commit.</div>
  </div>

  <!-- phone -->
  <div style="position:absolute;left:50%;top:320px;transform:translateX(-50%);width:380px;height:660px;background:#12122a;border-radius:46px;padding:13px;box-shadow:0 40px 90px -30px rgba(12,19,48,.5)">
    <div style="position:relative;width:100%;height:100%;background:#fff;border-radius:34px;overflow:hidden">
      <!-- header -->
      <div style="height:60px;background:var(--navy);display:flex;align-items:center;justify-content:center;color:#fff;font:700 16px/1 var(--head)">Checkout</div>
      <div style="padding:22px 24px">
        <div style="font:600 11px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2);margin-bottom:12px">Order summary</div>
        <div style="display:flex;align-items:center;gap:13px;padding-bottom:16px;border-bottom:1px solid var(--border)">
          <div style="width:52px;height:52px;border-radius:11px;background:#fff;border:1px solid var(--border);flex:0 0 auto;overflow:hidden"><img src="../assets/photos/p_headphones.jpg" alt="" style="width:100%;height:100%;object-fit:contain;padding:4px"></div>
          <div><div style="font:600 14px/1.3 var(--ink)">Sony WH-1000XM5</div><div style="font:500 12px/1 var(--muted);margin-top:5px">Qty 1 · AudioHub</div></div>
        </div>
        <div style="padding-top:8px">
          <div class="sumrow" style="animation:c-row1 10s ease both infinite"><span>Subtotal</span><b>£249.00</b></div>
          <div class="sumrow" style="animation:c-row2 10s ease both infinite"><span>Delivery (tomorrow)</span><b style="color:var(--good)">Free</b></div>
          <div class="sumrow" style="animation:c-row3 10s ease both infinite"><span>Buyer protection</span><b>Included</b></div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;padding-top:14px;border-top:2px solid var(--ink);animation:c-total 10s ease both infinite"><span style="font:700 17px/1 var(--head);color:var(--ink)">Total</span><span style="font:800 26px/1 var(--head);color:var(--ink)">£249.00</span></div>
        <div style="margin-top:22px;background:var(--blue);color:#fff;border-radius:13px;padding:17px 0;text-align:center;font:700 17px/1 var(--sans);animation:c-press 10s ease both infinite">Place order</div>
        <div style="text-align:center;font:500 11px/1 var(--muted);margin-top:12px">Nothing revealed at the last step</div>
      </div>
      <!-- confirm veil -->
      <div style="position:absolute;inset:0;background:rgba(255,255,255,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;animation:c-veil 10s ease both infinite">
        <div style="width:92px;height:92px;border-radius:50%;background:var(--good-bg);display:grid;place-items:center;animation:c-done 10s ease both infinite"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#1f9d57" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></div>
        <div style="font:700 22px/1.2 var(--head);color:var(--ink);text-align:center;animation:c-done 10s ease both infinite">Order confirmed</div>
        <div style="font:500 13px/1.4 var(--muted);text-align:center;animation:c-done 10s ease both infinite">Arriving tomorrow · Protected</div>
      </div>
    </div>
  </div>

</div>
</body>
</html>
