<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Thomas Mbanefo</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script>
  // Project pages that moved: send old links to the new address.
  (function () {
    var moved = {
      '/arbor': '/data-model/data-model.html',
      '/kova': '/analytics-reporting/analytics-reporting.html',
      '/verde': '/analytics-reporting/analytics-reporting.html'
    };
    var top = '/' + location.pathname.split('/')[1];
    if (moved[top]) location.replace(moved[top] + location.hash);
  })();
</script>
<style>
  :root { --p: #ffffff; --c: #2c2c2c; --brand: #ff5629; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
         background: var(--p); color: var(--c); font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; }
  h1 { font-size: clamp(2.4rem, 8vw, 5rem); font-weight: 800; line-height: .9; margin: 0 0 16px; text-transform: uppercase; }
  p { margin: 0 0 28px; opacity: .7; }
  a { display: inline-block; padding: 12px 22px; border-radius: 999px; background: var(--brand); color: #fff4ec; text-decoration: none; font-weight: 600; }
</style>
</head>

  <main>
