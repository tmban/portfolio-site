<!DOCTYPE html>
<html lang="en">
<head><meta name="viewport" content="width=device-width, initial-scale=1"><!--FIRA_OVERRIDE_START--><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,700&display=swap" rel="stylesheet"><style id="fira-override">*,*::before,*::after{font-family:'Fira Sans',sans-serif!important}</style><!--FIRA_OVERRIDE_END-->
<meta charset="UTF-8">
<title>Kova · Variance indicators</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#faf8f5; --bg-2:#f3efe9; --surface:#ffffff;
  --ink:#15110d; --ink-2:#3a342d; --muted:#8a8278; --muted-2:#b4ab9f;
  --border:#ebe6df; --border-2:#f0ebe4;
  --accent:#b85c38; --accent-l:rgba(184,92,56,.08); --accent-ll:rgba(184,92,56,.16);
  --green:#2a7a5a; --green-l:rgba(42,122,90,.10);
  --red:#c64545; --red-l:rgba(198,69,69,.10);
  --amber:#c6892b; --amber-l:rgba(198,137,43,.12);
  --serif:'Bricolage Grotesque',serif; --sans:'DM Sans',sans-serif; --mono:'DM Mono',monospace;
  --radius-md:8px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width:1080px; height:1080px; background:var(--bg); font-family:var(--sans); color:var(--ink); overflow:hidden; margin:0; }
.mg { position:relative; width:100%; height:100%; background:var(--bg); overflow:hidden; }
.mg-grid { position:absolute; inset:0; pointer-events:none;
  background-image:
    linear-gradient(rgba(21,17,13,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(21,17,13,.025) 1px, transparent 1px);
  background-size:60px 60px;
  mask-image: radial-gradient(ellipse 80% 70% at 50% 50%, black 30%, transparent 90%);
}
.mg-eyebrow { font-family:var(--mono); font-size:12px; font-weight:400; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); }
.mg-title { font-family:var(--serif); font-weight:700; letter-spacing:-.025em; color:var(--ink); line-height:1.05; }
.mg-watermark { position:absolute; left:56px; bottom:56px; display:flex; align-items:center; gap:12px; font-family:var(--mono); font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
.mg-watermark .dot { width:8px; height:8px; border-radius:50%; background:var(--accent); }
.mg-watermark strong { color:var(--ink); font-weight:500; }
.mg-corner-tag { position:absolute; right:56px; top:56px; font-family:var(--mono); font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; gap:8px; white-space:nowrap; }
.mg-corner-tag > span:first-child { display:inline-block; width:6px; height:6px; background:var(--ink); border-radius:50%; }
.k-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:24px; box-shadow:0 1px 2px 0 rgba(21,17,13,.05); }

@keyframes mg-fade-in { from { opacity:0; } to { opacity:1; } }
@keyframes mg-rise   { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
@keyframes mg10-bar-rise {
  0%, 100% { transform: scaleY(0); opacity: 0; }
  18%      { transform: scaleY(0); opacity: 0; }
  35%      { transform: scaleY(1); opacity: 1; }
  88%      { transform: scaleY(1); opacity: 1; }
  96%      { transform: scaleY(0); opacity: 0; }
}
@keyframes mg10-tick-in {
  0%, 100% { transform: scaleX(0); opacity: 0; }
  40%      { transform: scaleX(0); opacity: 0; }
  50%      { transform: scaleX(1); opacity: 1; }
  92%      { transform: scaleX(1); opacity: 1; }
}
@keyframes mg10-hover-card {
  0%, 100% { transform: translateY(0); box-shadow: 0 1px 0 rgba(21,17,13,.02), 0 12px 30px rgba(21,17,13,.04); border-color: var(--border); }
  56%      { transform: translateY(0); box-shadow: 0 1px 0 rgba(21,17,13,.02), 0 12px 30px rgba(21,17,13,.04); border-color: var(--border); }
  64%      { transform: translateY(-4px); box-shadow: 0 1px 0 rgba(21,17,13,.02), 0 22px 50px rgba(184,92,56,.18); border-color: rgba(184,92,56,.4); }
  90%      { transform: translateY(-4px); box-shadow: 0 1px 0 rgba(21,17,13,.02), 0 22px 50px rgba(184,92,56,.18); border-color: rgba(184,92,56,.4); }
}
@keyframes mg10-tooltip-pop {
  0%, 100% { opacity: 0; transform: translateY(6px) scale(.96); }
  62%      { opacity: 0; transform: translateY(6px) scale(.96); }
  70%      { opacity: 1; transform: translateY(0) scale(1); }
  90%      { opacity: 1; transform: translateY(0) scale(1); }
}

body:not(.mg-play) *, body:not(.mg-play) *::before, body:not(.mg-play) *::after { animation-name:none !important; }
body.mg-play { animation: mg-page-in 700ms cubic-bezier(.2,.6,.2,1) both; }
@keyframes mg-page-in { from { opacity:0; transform:scale(.985); } to { opacity:1; transform:scale(1); } }
</style>
</head>
<body class="mg-play">
<div class="mg" style="background:var(--bg)">
  <div class="mg-grid"></div>

  <div style="position:absolute; top:56px; left:56px; right:56px;">
    <div class="mg-title" style="font-size:56px; margin-top:12px; letter-spacing:-.035em;">
      The whole story,<br>in a single tile.
    </div>
  </div>

  <!-- 2x2 grid -->
  <div style="position:absolute; left:56px; right:56px; top:360px; bottom:160px; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:18px;">

    <!-- Card 1: Carbon (good) -->
    <div class="k-card" style="padding:22px 26px; display:grid; grid-template-columns:1fr 110px; gap:20px; align-items:stretch; position:relative; border:1.5px solid var(--border);">
      <div>
        <div style="font:500 11px/1 var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:14px;">Carbon</div>
        <div style="display:flex; align-items:baseline; gap:8px;">
          <div style="font:700 56px/1 var(--serif); letter-spacing:-.04em; color:var(--ink);">47.2</div>
          <div style="font:400 14px/1 var(--mono); color:var(--muted);">kgCO&#8322;e</div>
        </div>
        <div style="margin-top:18px; display:inline-flex; align-items:center; gap:8px; background:var(--green-l); color:var(--green); padding:6px 12px; border-radius:100px; font:500 12px/1 var(--mono); letter-spacing:.04em; opacity:0; animation:mg10-tooltip-pop 7s ease both infinite; animation-delay:0s;">
          <svg width="9" height="9" viewBox="0 0 9 9" fill="none"><path d="M1 3 L4.5 7 L8 3 Z" fill="var(--green)"/></svg>
          &minus;13% vs target
        </div>
      </div>
      <div style="position:relative; background:var(--bg-2); border-radius:10px; padding:14px 0;">
        <div style="position:absolute; left:50%; top:14px; bottom:14px; width:2px; background:var(--border); transform:translateX(-50%);"></div>
        <div style="position:absolute; left:20%; right:20%; top:32%; height:16%; background:rgba(184,92,56,.10); border:1px dashed rgba(184,92,56,.5); border-radius:6px; opacity:0; animation:mg10-tick-in 7s ease both infinite; animation-delay:0s; transform-origin:center;"></div>
        <div style="position:absolute; left:15%; right:15%; top:40%; height:2px; background:var(--accent); border-radius:2px; transform:scaleX(0); animation:mg10-tick-in 7s ease both infinite; animation-delay:0.15s;"></div>
        <div style="position:absolute; left:50%; top:48%; transform:translate(-50%,-50%); width:16px; height:16px; color:var(--muted-2); opacity:0; animation:mg10-tooltip-pop 7s ease both infinite; animation-delay:0.2s;">
          <svg viewBox="0 0 16 16" width="16" height="16">
            <line x1="3" y1="3" x2="13" y2="13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="13" y1="3" x2="3" y2="13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div style="position:absolute; left:38%; right:38%; top:62%; bottom:8%; background:var(--green); border-radius:4px; transform-origin:center bottom; transform:scaleY(0); animation:mg10-bar-rise 7s cubic-bezier(.22,1,.36,1) both infinite; animation-delay:0.25s;"></div>
      </div>
    </div>

    <!-- Card 2: Electricity (good) -->
    <div class="k-card" style="padding:22px 26px; display:grid; grid-template-columns:1fr 110px; gap:20px; align-items:stretch; position:relative; border:1.5px solid var(--border);">
      <div>
        <div style="font:500 11px/1 var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:14px;">Electricity</div>
        <div style="display:flex; align-items:baseline; gap:8px;">
          <div style="font:700 56px/1 var(--serif); letter-spacing:-.04em; color:var(--ink);">131</div>
          <div style="font:400 14px/1 var(--mono); color:var(--muted);">kWh/m&sup2;</div>
        </div>
        <div style="margin-top:18px; display:inline-flex; align-items:center; gap:8px; background:var(--green-l); color:var(--green); padding:6px 12px; border-radius:100px; font:500 12px/1 var(--mono); letter-spacing:.04em; opacity:0; animation:mg10-tooltip-pop 7s ease both infinite; animation-delay:0.06s;">
          <svg width="9" height="9" viewBox="0 0 9 9" fill="none"><path d="M1 3 L4.5 7 L8 3 Z" fill="var(--green)"/></svg>
          &minus;14% vs target
        </div>
      </div>
      <div style="position:relative; background:var(--bg-2); border-radius:10px; padding:14px 0;">
        <div style="position:absolute; left:50%; top:14px; bottom:14px; width:2px; background:var(--border); transform:translateX(-50%);"></div>
        <div style="position:absolute; left:20%; right:20%; top:34%; height:16%; background:rgba(184,92,56,.10); border:1px dashed rgba(184,92,56,.5); border-radius:6px; opacity:0; animation:mg10-tick-in 7s ease both infinite; animation-delay:0.06s; transform-origin:center;"></div>
        <div style="position:absolute; left:15%; right:15%; top:42%; height:2px; background:var(--accent); border-radius:2px; transform:scaleX(0); animation:mg10-tick-in 7s ease both infinite; animation-delay:calc(0.06s + .15s);"></div>
        <div style="position:absolute; left:50%; top:36%; transform:translate(-50%,-50%); width:16px; height:16px; color:var(--muted-2); opacity:0; animation:mg10-tooltip-pop 7s ease both infinite; animation-delay:calc(0.06s + .2s);">
          <svg viewBox="0 0 16 16" width="16" height="16">
            <line x1="3" y1="3" x2="13" y2="13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="13" y1="3" x2="3" y2="13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div style="position:absolute; left:38%; right:38%; top:58%; bottom:8%; background:var(--green); border-radius:4px; transform-origin:center bottom; transform:scaleY(0); animation:mg10-bar-rise 7s cubic-bezier(.22,1,.36,1) both infinite; animation-delay:calc(0.06s + .25s);"></div>
      </div>
    </div>

    <!-- Card 3: Water (bad, featured/hover) -->
    <div class="k-card" style="padding:22px 26px; display:grid; grid-template-columns:1fr 110px; gap:20px; align-items:stretch; position:relative; border:1.5px solid var(--border); animation:mg10-hover-card 7s ease both infinite;">
      <div>
        <div style="font:500 11px/1 var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:14px;">Water</div>
        <div style="display:flex; align-items:baseline; gap:8px;">
          <div style="font:700 56px/1 var(--serif); letter-spacing:-.04em; color:var(--ink);">0.84</div>
          <div style="font:400 14px/1 var(--mono); color:var(--muted);">m&sup3;/m&sup2;</div>
        </div>
        <div style="margin-top:18px; display:inline-flex; align-items:center; gap:8px; background:var(--red-l); color:var(--red); padding:6px 12px; border-radius:100px; font:500 12px/1 var(--mono); letter-spacing:.04em; opacity:0; animation:mg10-tooltip-pop 7s ease both infinite; animation-delay:0.12s;">
          <svg width="9" height="9" viewBox="0 0 9 9" fill="none"><path d="M1 6 L4.5 2 L8 6 Z" fill="var(--red)"/></svg>
          +9% vs target
        </div>
      </div>
      <div style="position:relative; background:var(--bg-2); border-radius:10px; padding:14px 0;">
        <div style="position:absolute; left:50%; top:14px; bottom:14px; width:2px; background:var(--border); transform:translateX(-50%);"></div>
        <div style="position:absolute; left:20%; right:20%; top:42%; height:16%; background:rgba(184,92,56,.10); border:1px dashed rgba(184,92,56,.5); border-radius:6px; opacity:0; animation:mg10-tick-in 7s ease both infinite; animation-delay:0.12s; transform-origin:center;"></div>
        <div style="position:absolute; left:15%; right:15%; top:50%; height:2px; background:var(--accent); border-radius:2px; transform:scaleX(0); animation:mg10-tick-in 7s ease both infinite; animation-delay:calc(0.12s + .15s);"></div>
        <div style="position:absolute; left:50%; top:44%; transform:translate(-50%,-50%); width:16px; height:16px; color:var(--muted-2); opacity:0; animation:mg10-tooltip-pop 7s ease both infinite; animation-delay:calc(0.12s + .2s);">
          <svg viewBox="0 0 16 16" width="16" height="16">
            <line x1="3" y1="3" x2="13" y2="13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="13" y1="3" x2="3" y2="13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div style="position:absolute; left:38%; right:38%; top:30%; bottom:8%; background:var(--red); border-radius:4px; transform-origin:center bottom; transform:scaleY(0); animation:mg10-bar-rise 7s cubic-bezier(.22,1,.36,1) both infinite; animation-delay:calc(0.12s + .25s);"></div>
      </div>
      <!-- Hover tooltip -->
      <div style="position:absolute; right:14px; top:-54px; background:var(--ink); color:#fff; padding:10px 14px; border-radius:10px; font:500 12px/1.5 var(--mono); letter-spacing:.04em; white-space:nowrap; opacity:0; transform-origin:bottom right; animation:mg10-tooltip-pop 7s cubic-bezier(.22,1,.36,1) both infinite; box-shadow:0 18px 40px rgba(21,17,13,.2); z-index:5;">
        <div style="display:flex; gap:18px; align-items:baseline;">
          <div>
            <div style="opacity:.5; font-size:10px;">ACTUAL</div>
            <div style="font:700 18px/1 var(--serif); letter-spacing:-.02em; margin-top:3px;">0.84</div>
          </div>
          <div>
            <div style="opacity:.5; font-size:10px;">TARGET</div>
            <div style="font:700 18px/1 var(--serif); letter-spacing:-.02em; margin-top:3px;">0.77</div>
          </div>
          <div>
            <div style="opacity:.5; font-size:10px;">PREV</div>
            <div style="font:700 18px/1 var(--serif); letter-spacing:-.02em; margin-top:3px;">0.79</div>
          </div>
        </div>
        <div style="position:absolute; bottom:-6px; right:24px; width:0; height:0; border-left:6px solid transparent; border-right:6px solid transparent; border-top:6px solid var(--ink);"></div>
      </div>
    </div>

    <!-- Card 4: Waste (good) -->
    <div class="k-card" style="padding:22px 26px; display:grid; grid-template-columns:1fr 110px; gap:20px; align-items:stretch; position:relative; border:1.5px solid var(--border);">
      <div>
        <div style="font:500 11px/1 var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:14px;">Waste</div>
        <div style="display:flex; align-items:baseline; gap:8px;">
          <div style="font:700 56px/1 var(--serif); letter-spacing:-.04em; color:var(--ink);">78%</div>
          <div style="font:400 14px/1 var(--mono); color:var(--muted);">recycled</div>
        </div>
        <div style="margin-top:18px; display:inline-flex; align-items:center; gap:8px; background:var(--green-l); color:var(--green); padding:6px 12px; border-radius:100px; font:500 12px/1 var(--mono); letter-spacing:.04em; opacity:0; animation:mg10-tooltip-pop 7s ease both infinite; animation-delay:0.18s;">
          <svg width="9" height="9" viewBox="0 0 9 9" fill="none"><path d="M1 3 L4.5 7 L8 3 Z" fill="var(--green)"/></svg>
          +12pp vs prev
        </div>
      </div>
      <div style="position:relative; background:var(--bg-2); border-radius:10px; padding:14px 0;">
        <div style="position:absolute; left:50%; top:14px; bottom:14px; width:2px; background:var(--border); transform:translateX(-50%);"></div>
        <div style="position:absolute; left:20%; right:20%; top:27%; height:16%; background:rgba(184,92,56,.10); border:1px dashed rgba(184,92,56,.5); border-radius:6px; opacity:0; animation:mg10-tick-in 7s ease both infinite; animation-delay:0.18s; transform-origin:center;"></div>
        <div style="position:absolute; left:15%; right:15%; top:35%; height:2px; background:var(--accent); border-radius:2px; transform:scaleX(0); animation:mg10-tick-in 7s ease both infinite; animation-delay:calc(0.18s + .15s);"></div>
        <div style="position:absolute; left:50%; top:30%; transform:translate(-50%,-50%); width:16px; height:16px; color:var(--muted-2); opacity:0; animation:mg10-tooltip-pop 7s ease both infinite; animation-delay:calc(0.18s + .2s);">
          <svg viewBox="0 0 16 16" width="16" height="16">
            <line x1="3" y1="3" x2="13" y2="13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="13" y1="3" x2="3" y2="13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div style="position:absolute; left:38%; right:38%; top:22%; bottom:8%; background:var(--green); border-radius:4px; transform-origin:center bottom; transform:scaleY(0); animation:mg10-bar-rise 7s cubic-bezier(.22,1,.36,1) both infinite; animation-delay:calc(0.18s + .25s);"></div>
      </div>
    </div>

  </div>
</div>
</body>
</html>
