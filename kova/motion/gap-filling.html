}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width:1080px; height:1080px; background:var(--bg); font-family:var(--sans); color:var(--ink); overflow:hidden; margin:0; }
.mg { position:relative; width:100%; height:100%; background:var(--bg); overflow:hidden; }
.mg-grid { position:absolute; inset:0; pointer-events:none;
  background-image:
    linear-gradient(rgba(21,17,13,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(21,17,13,.025) 1px, transparent 1px);
  background-size:60px 60px;
  mask-image: radial-gradient(ellipse 80% 70% at 50% 50%, black 30%, transparent 90%);
}
.mg-eyebrow { font-family:var(--mono); font-size:12px; font-weight:400; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); }
.mg-title { font-family:var(--serif); font-weight:700; letter-spacing:-.025em; color:var(--ink); line-height:1.05; }
.mg-watermark { position:absolute; left:56px; bottom:56px; display:flex; align-items:center; gap:12px; font-family:var(--mono); font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
.mg-watermark .dot { width:8px; height:8px; border-radius:50%; background:var(--accent); }
.mg-watermark strong { color:var(--ink); font-weight:500; }
.mg-corner-tag { position:absolute; right:56px; top:56px; font-family:var(--mono); font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; gap:8px; white-space:nowrap; }
.mg-corner-tag > span:first-child { display:inline-block; width:6px; height:6px; background:var(--ink); border-radius:50%; }
.k-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:24px; box-shadow:0 1px 2px 0 rgba(21,17,13,.05); }
.k-card-title { font-family:var(--serif); font-weight:600; font-size:16px; letter-spacing:-.01em; color:var(--ink); }
.k-card-sub { font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-top:2px; }

@keyframes mg-fade-in { from { opacity:0; } to { opacity:1; } }
@keyframes mg14-point-in {
  0%, 100% { transform: scale(0); opacity: 0; }
  8%       { transform: scale(0); opacity: 0; }
  16%      { transform: scale(1); opacity: 1; }
  92%      { transform: scale(1); opacity: 1; }
}
@keyframes mg14-scan {
  0%, 100% { left: -4%; opacity: 0; }
  30%      { left: -4%; opacity: 0; }
  36%      { opacity: 1; }
  60%      { left: 104%; opacity: 1; }
  64%      { opacity: 0; }
}
@keyframes mg14-gap-fill {
  0%, 100% { background: var(--bg); border-color: var(--border-2); transform: scale(0.6); opacity: 0; }
  18%      { background: var(--bg); border-color: var(--red); transform: scale(1); opacity: 1; }
  56%      { background: var(--bg); border-color: var(--red); transform: scale(1); opacity: 1; }
  60%      { background: var(--amber); border-color: var(--amber); transform: scale(1.25); opacity: 1; }
  66%      { background: var(--amber); border-color: var(--amber); transform: scale(1); opacity: 1; }
  92%      { background: var(--amber); border-color: var(--amber); transform: scale(1); opacity: 1; }
}
@keyframes mg14-conf {
  0%, 100% { width: 0%; opacity: 0; }
  68%      { width: 0%; opacity: 0; }
  80%      { width: var(--pct); opacity: 1; }
  92%      { width: var(--pct); opacity: 1; }
}

body:not(.mg-play) *, body:not(.mg-play) *::before, body:not(.mg-play) *::after { animation-name:none !important; }
body.mg-play { animation: mg-page-in 700ms cubic-bezier(.2,.6,.2,1) both; }
@keyframes mg-page-in { from { opacity:0; transform:scale(.985); } to { opacity:1; transform:scale(1); } }
