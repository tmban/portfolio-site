<style>
:root {
  --bg:#faf8f5; --bg-2:#f3efe9; --surface:#ffffff;
  --ink:#15110d; --ink-2:#3a342d; --muted:#8a8278; --muted-2:#b4ab9f;
  --border:#ebe6df; --border-2:#f0ebe4;
  --accent:#C81E4A; --accent-l:rgba(200,30,74,.08); --accent-ll:rgba(200,30,74,.16);
  --green:#2a7a5a; --green-l:rgba(42,122,90,.10);
  --red:#c64545; --red-l:rgba(198,69,69,.10);
  --amber:#c6892b; --amber-l:rgba(198,137,43,.12);
  --serif:'Bricolage Grotesque',serif; --sans:'DM Sans',sans-serif; --mono:'DM Mono',monospace;
  --radius-sm:4px; --radius:6px; --radius-md:8px; --radius-lg:12px; --radius-full:9999px;
  --shadow-sm:0 1px 2px 0 rgba(21,17,13,.05);
  --shadow-md:0 4px 6px -1px rgba(21,17,13,.10), 0 2px 4px -2px rgba(21,17,13,.06);
  --shadow-lg:0 10px 15px -3px rgba(21,17,13,.10), 0 4px 6px -4px rgba(21,17,13,.06);
  --shadow-xl:0 20px 25px -5px rgba(21,17,13,.12), 0 8px 10px -6px rgba(21,17,13,.04);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width:1080px; height:1080px; background:var(--bg); font-family:var(--sans); color:var(--ink); overflow:hidden; margin:0; }
.mg { position:relative; width:100%; height:100%; background:var(--bg); overflow:hidden; }
.mg-grid { position:absolute; inset:0; pointer-events:none;
  background-image:
    linear-gradient(rgba(21,17,13,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(21,17,13,.025) 1px, transparent 1px);
  background-size:60px 60px;
  mask-image: radial-gradient(ellipse 80% 70% at 50% 50%, black 30%, transparent 90%);
}
.ui-eyebrow { font-family:var(--mono); font-size:12px; font-weight:400; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); }
.ui-label { font-family:var(--mono); font-size:11px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
.mg-watermark { position:absolute; left:56px; bottom:56px; display:flex; align-items:center; gap:12px; font-family:var(--mono); font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
.mg-watermark .dot { width:8px; height:8px; border-radius:50%; background:var(--accent); }
.mg-watermark strong { color:var(--ink); font-weight:500; }
.mg-corner-tag { position:absolute; right:56px; top:56px; font-family:var(--mono); font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; gap:8px; white-space:nowrap; }
.ui-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); box-shadow:var(--shadow-sm); }
.ui-badge { display:inline-flex; align-items:center; gap:6px; font-family:var(--mono); font-weight:500; font-size:10px; line-height:1; letter-spacing:.12em; text-transform:uppercase; padding:4px 8px; border-radius:var(--radius-sm); border:1px solid transparent; white-space:nowrap; }
.ui-badge-secondary { background:var(--bg-2); color:var(--ink-2); border-color:var(--border); }
.ui-badge-success { background:var(--green-l); color:var(--green); }
.ui-badge-destructive { background:var(--red-l); color:var(--red); }

.leaflet-container { background: var(--bg-2) !important; font-family: var(--sans); }
.leaflet-control-attribution { display: none !important; }

.kova-pin { background: transparent !important; border: none !important; }
.kova-pin-dot {
  display:block; width:14px; height:14px; border-radius:50%;
  border:2.5px solid #fff; box-shadow:0 2px 6px rgba(21,17,13,.35);
  transform: scale(0);
  animation: mg17-pin-drop-v2 8s cubic-bezier(.34,1.5,.64,1) both infinite;
}
.kova-pin-pulse {
  display:block; width:40px; height:40px; border-radius:50%;
  border:2px solid var(--accent); opacity:0;
  animation: mg17-pin-pulse-v2 2.4s ease-out infinite;
}

@keyframes mg17-pin-drop-v2 {
  0%, 100% { transform: scale(0); }
  14%      { transform: scale(0); }
  22%      { transform: scale(1.25); }
  28%      { transform: scale(1); }
  90%      { transform: scale(1); }
  96%      { transform: scale(0); }
}
@keyframes mg17-pin-pulse-v2 {
  0%   { transform: scale(.4); opacity: .7; }
  70%  { transform: scale(2.2); opacity: 0; }
  100% { transform: scale(2.2); opacity: 0; }
}
@keyframes mg17-tip {
  0%, 100% { opacity: 0; transform: translate(-50%, calc(-100% - 6px)) scale(.92); }
  62%      { opacity: 0; transform: translate(-50%, calc(-100% - 4px)) scale(.92); }
  72%      { opacity: 1; transform: translate(-50%, calc(-100% - 12px)) scale(1); }
  90%      { opacity: 1; transform: translate(-50%, calc(-100% - 12px)) scale(1); }
}
@keyframes mg-rise   { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

body:not(.mg-play) *, body:not(.mg-play) *::before, body:not(.mg-play) *::after { animation-name:none !important; }
body.mg-play { animation: mg-page-in 700ms cubic-bezier(.2,.6,.2,1) both; }
@keyframes mg-page-in { from { opacity:0; transform:scale(.985); } to { opacity:1; transform:scale(1); } }
</style>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
<script>
(function(){
  if (!window.L) return;
  var pins = [
    { lat: 51.5388, lon: -0.1102, tone: 'bad',   featured: true },
    { lat: 51.4978, lon: -0.1003, tone: 'good' },
    { lat: 51.5331, lon: -0.0974, tone: 'good' },
    { lat: 51.4961, lon: -0.1187, tone: 'amber' },
    { lat: 51.5273, lon: -0.0651, tone: 'amber' },
    { lat: 53.4612, lon: -2.2671, tone: 'good' },
    { lat: 53.4998, lon: -2.2293, tone: 'amber' },
    { lat: 53.3858, lon: -2.9641, tone: 'amber' },
    { lat: 55.9357, lon: -3.2104, tone: 'good' },
    { lat: 55.8821, lon: -4.2746, tone: 'amber' },
    { lat: 53.3321, lon: -6.2387, tone: 'good' },
    { lat: 54.9961, lon: -1.5953, tone: 'amber' },
    { lat: 51.4722, lon: -2.6104, tone: 'good' },
    { lat: 52.5039, lon: -1.8681, tone: 'amber' },
    { lat: 53.8174, lon: -1.5269, tone: 'good' }
  ];
  function colorFor(t){ return t === 'good' ? '#2a7a5a' : t === 'bad' ? '#c64545' : '#c6892b'; }
  var el = document.getElementById('kova-map');
  if (!el) return;
  var map = window.L.map(el, {
    center: [54.0, -3.0], zoom: 5,
    zoomControl: false, attributionControl: false,
    dragging: false, scrollWheelZoom: false, doubleClickZoom: false,
    touchZoom: false, keyboard: false, zoomSnap: 0.25, fadeAnimation: false
  });
  window.L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png',
    { subdomains: 'abcd', maxZoom: 19 }).addTo(map);
  pins.forEach(function(p, i){
    var icon = window.L.divIcon({
      className: 'kova-pin',
      html: '<span class="kova-pin-dot" style="background:' + colorFor(p.tone) + ';animation-delay:' + (0.08 * i + 0.3) + 's"></span>',
      iconSize: [16,16], iconAnchor: [8,8]
    });
    window.L.marker([p.lat, p.lon], { icon: icon, interactive: false }).addTo(map);
    if (p.featured) {
      var ring = window.L.divIcon({
        className: 'kova-pin',
        html: '<span class="kova-pin-pulse" style="border-color:' + colorFor(p.tone) + '"></span>',
        iconSize: [40,40], iconAnchor: [20,20]
      });
      window.L.marker([p.lat, p.lon], { icon: ring, interactive: false }).addTo(map);
    }
  });
  setTimeout(function(){ map.invalidateSize(); }, 50);
})();
</script>
