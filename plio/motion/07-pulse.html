<!DOCTYPE html>
<html lang="en">
<head><meta name="viewport" content="width=device-width, initial-scale=1"><!--FIRA_OVERRIDE_START--><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,700&display=swap" rel="stylesheet"><style id="fira-override">*,*::before,*::after{font-family:'Fira Sans',sans-serif!important}</style><!--FIRA_OVERRIDE_END-->
<meta charset="UTF-8">
<title>Plio · Extraction engine</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--bg-soft:#f7f7f5;--bg-lav:#f3effe;--surface:#fff;--ink:#0f0f0e;--ink-2:#1a1a18;--muted:#6b6b64;--muted-2:#999;--muted-3:#bbb;--border:#ebebeb;--border-2:#f0f0ee;--violet:#7c3aed;--violet-l:rgba(124,58,237,.08);--violet-bdr:#e4d4fc;--conf-high-bg:#edf7ee;--conf-high-ink:#16a34a;--conf-high-dot:#22c55e;--conf-low-dot:#f59e0b;--serif:'Bricolage Grotesque',serif;--sans:'DM Sans',sans-serif;--mono:'DM Mono',monospace}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1080px;background:#efeae3;font-family:var(--sans);color:var(--ink);overflow:hidden}
.mg{position:relative;width:100%;height:100%;background:var(--bg);overflow:hidden}
.mg-grid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(15,15,14,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(15,15,14,.028) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(ellipse 80% 70% at 50% 50%,black 30%,transparent 90%)}
.mg-eyebrow{font:600 12px/1 var(--sans);letter-spacing:.15em;text-transform:uppercase;color:var(--violet)}
.mg-title{font:800 54px/1.02 var(--serif);letter-spacing:-.04em;color:var(--ink)}
.mg-corner-tag{position:absolute;right:56px;top:56px;font:400 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.mg-corner-tag .dt{width:6px;height:6px;background:var(--ink);border-radius:50%}
.mg-watermark{position:absolute;left:56px;bottom:56px;display:flex;align-items:center;gap:12px;font:400 13px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mg-watermark .dot{width:8px;height:8px;border-radius:50%;background:var(--violet)}
.mg-watermark strong{color:var(--ink);font-weight:500}

@keyframes barA{0%,10%{width:0%}40%,100%{width:72%}}
@keyframes barB{0%,10%{width:0%}40%,100%{width:61%}}
@keyframes barC{0%,10%{width:0%}40%,100%{width:94%}}
@keyframes winner{0%,46%{opacity:0;transform:translateY(10px)}51%,100%{opacity:1;transform:translateY(0)}}
@keyframes status-q{0%,9%{opacity:1}10%,100%{opacity:0}}
@keyframes status-r{0%,9%{opacity:0}10%,45%{opacity:1}46%,100%{opacity:0}}
@keyframes status-c{0%,45%{opacity:0}46%,100%{opacity:1}}
@keyframes pg-wave{0%,100%{height:8px;opacity:.4}50%{height:26px;opacity:1}}

body:not(.mg-play) *,body:not(.mg-play) *::before,body:not(.mg-play) *::after{animation-name:none !important}
body.mg-play{animation:mg-page-in 700ms cubic-bezier(.2,.6,.2,1) both}
@keyframes mg-page-in{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:scale(1)}}

.race{display:flex;align-items:center;gap:22px}
.race .lbl{width:130px;flex-shrink:0;font:600 13px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.race .bar{flex:1;height:8px;background:#ececea;border-radius:99px;overflow:hidden}
.race .bar > div{height:100%;border-radius:99px}
.race .pct{width:52px;text-align:right;font:600 18px/1 var(--sans);color:var(--ink-2)}
</style>
</head>
<body class="mg-play">
<div class="mg">
  <div class="mg-grid"></div>

  <div style="position:absolute;top:64px;left:72px;right:72px">
    <div class="mg-title" style="margin-top:12px">Three approaches.<br>One winning signal.</div>
  </div>

  <div style="position:absolute;left:110px;right:110px;top:326px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:38px 44px;box-shadow:0 24px 48px -16px rgba(15,15,14,.12)">
    <div style="display:flex;align-items:center;gap:18px;margin-bottom:34px">
      <div style="width:56px;height:56px;border-radius:12px;background:var(--bg-lav);border:1px solid var(--violet-bdr);display:grid;place-items:center">
        <svg width="28" height="28" viewBox="0 0 32 32" fill="none"><rect x="3" y="3" width="26" height="26" rx="7" fill="var(--violet)"/><rect x="10" y="9" width="9" height="14" rx="2" fill="#fff" opacity=".95"/><circle cx="21" cy="11" r="3" fill="#fff"/><circle cx="21" cy="11" r="1.3" fill="var(--violet)"/></svg>
      </div>
      <div>
        <div style="font:700 19px/1.2 var(--serif);color:var(--ink)">INV-2024-DE-0048.pdf</div>
        <div style="font:400 13px/1 var(--mono);color:var(--muted);margin-top:7px;letter-spacing:.03em">Siemens AG &middot; Germany &middot; €18,450.00 &middot; received 2s ago</div>
      </div>
      <div style="flex:1"></div>
      <span style="position:relative;width:140px;height:14px;display:inline-block">
        <span style="position:absolute;right:0;top:0;font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted-3);animation:status-q 8s steps(1) both infinite">queued</span>
        <span style="position:absolute;right:0;top:0;font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--violet);animation:status-r 8s steps(1) both infinite;opacity:0">racing…</span>
        <span style="position:absolute;right:0;top:0;font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--conf-high-ink);animation:status-c 8s steps(1) both infinite;opacity:0">converged</span>
      </span>
    </div>

    <div style="display:flex;flex-direction:column;gap:22px;margin-bottom:34px">
      <div class="race"><span class="lbl">OCR + Rule</span><div class="bar"><div style="background:var(--violet);animation:barA 8s cubic-bezier(.23,1,.32,1) both infinite"></div></div><span class="pct">72%</span></div>
      <div class="race"><span class="lbl">LLM Parse</span><div class="bar"><div style="background:var(--conf-low-dot);animation:barB 8s cubic-bezier(.23,1,.32,1) both infinite"></div></div><span class="pct">61%</span></div>
      <div class="race"><span class="lbl">Hybrid</span><div class="bar"><div style="background:var(--conf-high-dot);animation:barC 8s cubic-bezier(.23,1,.32,1) both infinite"></div></div><span class="pct">94%</span></div>
    </div>

    <div style="display:flex;align-items:center;gap:26px;padding:22px 26px;border-radius:14px;background:var(--conf-high-bg);border:1px solid var(--conf-high-dot);animation:winner 8s ease both infinite;opacity:0">
      <div style="font:800 48px/1 var(--serif);letter-spacing:-.03em;color:var(--conf-high-ink)">94%</div>
      <div>
        <div style="font:700 17px/1.2 var(--serif);color:var(--ink)">Hybrid approach selected</div>
        <div style="font:400 13px/1.5 var(--sans);color:var(--muted);margin-top:4px">High confidence &middot; ready to post &middot; 14 fields extracted</div>
      </div>
      <div style="flex:1"></div>
      <div style="display:flex;align-items:center;gap:4px;height:30px">
        <div style="width:4px;border-radius:2px;background:var(--conf-high-dot);height:8px;animation:pg-wave 1.2s ease-in-out 0s infinite"></div>
        <div style="width:4px;border-radius:2px;background:var(--conf-high-dot);height:8px;animation:pg-wave 1.2s ease-in-out .1s infinite"></div>
        <div style="width:4px;border-radius:2px;background:var(--conf-high-dot);height:8px;animation:pg-wave 1.2s ease-in-out .2s infinite"></div>
        <div style="width:4px;border-radius:2px;background:var(--conf-high-dot);height:8px;animation:pg-wave 1.2s ease-in-out .3s infinite"></div>
        <div style="width:4px;border-radius:2px;background:var(--conf-high-dot);height:8px;animation:pg-wave 1.2s ease-in-out .4s infinite"></div>
        <div style="width:4px;border-radius:2px;background:var(--conf-high-dot);height:8px;animation:pg-wave 1.2s ease-in-out .15s infinite"></div>
        <div style="width:4px;border-radius:2px;background:var(--conf-high-dot);height:8px;animation:pg-wave 1.2s ease-in-out .25s infinite"></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
