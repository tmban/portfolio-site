<!DOCTYPE html>
<html lang="en">
<head><meta name="viewport" content="width=device-width, initial-scale=1"><!--FIRA_OVERRIDE_START--><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,700&display=swap" rel="stylesheet"><style id="fira-override">*,*::before,*::after{font-family:'Fira Sans',sans-serif!important}</style><!--FIRA_OVERRIDE_END-->
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://*.basemaps.cartocdn.com https://unpkg.com; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Plio · Bulk ingestion</title>

<style>
:root{
  --bg:#fff; --bg-soft:#f7f7f5; --bg-lav:#f3effe; --surface:#fff;
  --ink:#0f0f0e; --ink-2:#1a1a18; --muted:#6b6b64; --muted-2:#999; --muted-3:#bbb;
  --border:#ebebeb; --border-2:#f0f0ee;
  --violet:#7c3aed; --violet-d:#6d28d9; --violet-l:rgba(124,58,237,.08); --violet-bdr:#e4d4fc;
  --lilac:#a78bfa; --lav:#f3effe; --copper:#b85c38; --copper-l:rgba(184,92,56,.08);
  --conf-high-bg:#edf7ee; --conf-high-ink:#16a34a; --conf-high-dot:#22c55e;
  --conf-low-bg:#fff8e6; --conf-low-ink:#d97706; --conf-low-dot:#f59e0b;
  --conf-fail-bg:#fef2f2; --conf-fail-ink:#dc2626; --conf-fail-dot:#ef4444;
  --serif:'Bricolage Grotesque',serif; --sans:'DM Sans',sans-serif; --mono:'DM Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1080px;background:#efeae3;font-family:var(--sans);color:var(--ink);overflow:hidden}
.mg{position:relative;width:100%;height:100%;background:var(--bg);overflow:hidden}
.mg-grid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(15,15,14,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(15,15,14,.028) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(ellipse 80% 70% at 50% 50%,black 30%,transparent 90%)}
.mg-eyebrow{font:600 12px/1 var(--sans);letter-spacing:.15em;text-transform:uppercase;color:var(--violet)}
.mg-title{font:800 56px/1.02 var(--serif);letter-spacing:-.04em;color:var(--ink)}
.mg-label{font:400 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mg-corner-tag{position:absolute;right:56px;top:56px;font:400 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.mg-corner-tag .dt{width:6px;height:6px;background:var(--ink);border-radius:50%}
.mg-watermark{position:absolute;left:56px;bottom:56px;display:flex;align-items:center;gap:12px;font:400 13px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mg-watermark .dot{width:8px;height:8px;border-radius:50%;background:var(--violet)}
.mg-watermark strong{color:var(--ink);font-weight:500}

@keyframes pg01-doc-fall{0%,100%{opacity:0;transform:translateY(-300px) rotate(-9deg)}10%{opacity:0;transform:translateY(-300px) rotate(-9deg)}30%{opacity:1;transform:translateY(0) rotate(0)}92%{opacity:1;transform:translateY(0) rotate(0)}}
@keyframes pg01-zone{0%,26%{border-color:var(--border);background:var(--bg-soft)}30%,92%{border-color:var(--violet);background:var(--violet-l)}}
@keyframes pg01-ring{0%,28%{opacity:0;transform:scale(.5)}34%{opacity:.55;transform:scale(1.5)}44%{opacity:0;transform:scale(2.3)}100%{opacity:0}}
@keyframes pg01-bar{0%,100%{width:0%}36%{width:0%}64%{width:100%}92%{width:100%}}
@keyframes pg01-toast{0%,100%{opacity:0;transform:translate(-50%,12px)}68%{opacity:0;transform:translate(-50%,12px)}76%{opacity:1;transform:translate(-50%,0)}92%{opacity:1;transform:translate(-50%,0)}}
@keyframes pg01-chip{0%,100%{background:var(--surface);color:var(--muted);border-color:var(--border)}50%{background:var(--violet-l);color:var(--violet);border-color:var(--violet-bdr)}}
@keyframes pg-fade-in{0%,100%{opacity:0}8%,92%{opacity:1}}

body:not(.mg-play) *,body:not(.mg-play) *::before,body:not(.mg-play) *::after{animation-name:none !important}
body.mg-play{animation:mg-page-in 700ms cubic-bezier(.2,.6,.2,1) both}
@keyframes mg-page-in{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:scale(1)}}

.doc{position:absolute;inset:0;width:150px;height:196px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 10px 24px -12px rgba(15,15,14,.18);padding:20px 18px;animation:pg01-doc-fall 9s cubic-bezier(.34,1.3,.5,1) both infinite}
.doc.front{box-shadow:0 18px 40px -12px rgba(124,58,237,.30)}
.doc .docH{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.doc .docH .fmt{font:600 9px/1 var(--mono);letter-spacing:.1em}
.doc .bar{height:5px;background:#e6e6e3;border-radius:3px;margin-bottom:9px}
.doc .bar.first{background:currentColor}

.chip{font:500 14px/1 var(--sans);padding:10px 18px;border:1px solid var(--border);border-radius:100px;background:var(--surface);color:var(--muted);animation:pg01-chip 9s ease both infinite}

.logo-tile{width:20px;height:20px;border-radius:5px;background:var(--violet);position:relative}
.logo-tile::before{content:'';position:absolute;left:5px;top:4px;width:7px;height:11px;background:#fff;border-radius:1.5px;opacity:.95}
.logo-tile::after{content:'';position:absolute;right:3px;top:3px;width:5px;height:5px;background:#fff;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--violet)}
</style>
</head>
<body class="mg-play">
<div class="mg" style="background:var(--bg-soft)">
  <div class="mg-grid"></div>

  <div style="position:absolute;top:64px;left:72px;right:72px;animation:pg-fade-in 9s ease both infinite">
    <div class="mg-title" style="font-size:56px;margin-top:14px">Drop the whole inbox.<br>Plio reads all of it.</div>
  </div>

  <div style="position:absolute;top:250px;left:0;right:0;display:flex;justify-content:center;gap:12px">
    <div class="chip" style="animation-delay:0s">PDF</div>
    <div class="chip" style="animation-delay:.5s">Scan</div>
    <div class="chip" style="animation-delay:1s">Image</div>
    <div class="chip" style="animation-delay:1.5s">XLSX</div>
  </div>

  <div style="position:absolute;left:290px;right:290px;top:340px;height:430px;border:2px dashed var(--border);border-radius:20px;background:var(--bg-soft);animation:pg01-zone 9s ease both infinite;display:flex;flex-direction:column;align-items:center;justify-content:center">

    <div style="position:absolute;top:150px;width:150px;height:150px;border-radius:50%;border:2px solid var(--violet);animation:pg01-ring 9s ease both infinite"></div>

    <div style="position:relative;width:150px;height:196px;margin-bottom:8px">
      <div class="doc" style="transform:translateX(-46px) rotate(-10deg);transform-origin:bottom center;z-index:0;animation-delay:0s;color:#cf7a52">
        <div class="docH"><span class="logo-tile"></span><span class="fmt" style="color:#cf7a52">XLSX</span></div>
        <div class="bar first" style="width:100%"></div><div class="bar" style="width:78%"></div><div class="bar" style="width:90%"></div><div class="bar" style="width:64%"></div><div class="bar" style="width:84%"></div><div class="bar" style="width:50%"></div>
      </div>
      <div class="doc" style="transform:translateX(-22px) rotate(-5deg);transform-origin:bottom center;z-index:1;animation-delay:.1s;color:#a78bfa">
        <div class="docH"><span class="logo-tile"></span><span class="fmt" style="color:#a78bfa">SCAN</span></div>
        <div class="bar first" style="width:100%"></div><div class="bar" style="width:78%"></div><div class="bar" style="width:90%"></div><div class="bar" style="width:64%"></div><div class="bar" style="width:84%"></div><div class="bar" style="width:50%"></div>
      </div>
      <div class="doc" style="transform:translateX(2px) rotate(0);transform-origin:bottom center;z-index:2;animation-delay:.2s;color:#8b5cf6">
        <div class="docH"><span class="logo-tile"></span><span class="fmt" style="color:#8b5cf6">PDF</span></div>
        <div class="bar first" style="width:100%"></div><div class="bar" style="width:78%"></div><div class="bar" style="width:90%"></div><div class="bar" style="width:64%"></div><div class="bar" style="width:84%"></div><div class="bar" style="width:50%"></div>
      </div>
      <div class="doc" style="transform:translateX(26px) rotate(5deg);transform-origin:bottom center;z-index:3;animation-delay:.3s;color:var(--lilac)">
        <div class="docH"><span class="logo-tile"></span><span class="fmt" style="color:var(--lilac)">PDF</span></div>
        <div class="bar first" style="width:100%"></div><div class="bar" style="width:78%"></div><div class="bar" style="width:90%"></div><div class="bar" style="width:64%"></div><div class="bar" style="width:84%"></div><div class="bar" style="width:50%"></div>
      </div>
      <div class="doc front" style="transform:translateX(50px) rotate(10deg);transform-origin:bottom center;z-index:4;animation-delay:.4s;color:var(--violet)">
        <div class="docH"><span class="logo-tile"></span><span class="fmt" style="color:var(--violet)">PDF</span></div>
        <div class="bar first" style="width:100%"></div><div class="bar" style="width:78%"></div><div class="bar" style="width:90%"></div><div class="bar" style="width:64%"></div><div class="bar" style="width:84%"></div><div class="bar" style="width:50%"></div>
      </div>
    </div>

    <div style="margin-top:30px;display:flex;align-items:center;gap:10px">
      <span style="font:500 15px/1 var(--sans);color:var(--violet)">12 invoices selected</span>
      <span style="font:400 13px/1 var(--mono);color:var(--muted)">· 4.2 MB</span>
    </div>

    <div style="margin-top:16px;width:300px;height:7px;background:rgba(124,58,237,.14);border-radius:100px;overflow:hidden">
      <div style="height:100%;border-radius:100px;background:linear-gradient(90deg,var(--violet) 0%,var(--lilac) 100%);animation:pg01-bar 9s ease both infinite"></div>
    </div>
  </div>

  <div style="position:absolute;left:50%;bottom:150px;display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;padding:14px 22px;border-radius:12px;box-shadow:0 20px 40px -12px rgba(15,15,14,.4);animation:pg01-toast 9s ease both infinite;transform:translateX(-50%)">
    <span style="width:22px;height:22px;border-radius:50%;background:var(--violet);display:grid;place-items:center;font:700 12px/1 var(--sans)">&#10003;</span>
    <span style="font:500 15px/1 var(--sans)">Parsing started — 12 invoices queued, ~60 fields</span>
  </div>
</div>
</body>
</html>
