<!DOCTYPE html>
<html lang="en">
<head><meta name="viewport" content="width=device-width, initial-scale=1"><!--FIRA_OVERRIDE_START--><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,700&display=swap" rel="stylesheet"><style id="fira-override">*,*::before,*::after{font-family:'Fira Sans',sans-serif!important}</style><!--FIRA_OVERRIDE_END-->
<meta charset="UTF-8">
<title>Plio · Confidence scoring</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--bg-soft:#f7f7f5;--surface:#fff;--ink:#0f0f0e;--ink-2:#1a1a18;--muted:#6b6b64;--muted-2:#999;--muted-3:#bbb;--border:#ebebeb;--border-2:#f0f0ee;--violet:#7c3aed;--violet-l:rgba(124,58,237,.08);--conf-high-bg:#edf7ee;--conf-high-ink:#16a34a;--conf-high-dot:#22c55e;--conf-low-bg:#fff8e6;--conf-low-ink:#d97706;--conf-low-dot:#f59e0b;--conf-fail-bg:#fef2f2;--conf-fail-ink:#dc2626;--conf-fail-dot:#ef4444;--serif:'Bricolage Grotesque',serif;--sans:'DM Sans',sans-serif;--mono:'DM Mono',monospace}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1080px;background:#efeae3;font-family:var(--sans);color:var(--ink);overflow:hidden}
.mg{position:relative;width:100%;height:100%;background:var(--bg);overflow:hidden}
.mg-grid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(15,15,14,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(15,15,14,.028) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(ellipse 80% 70% at 50% 50%,black 30%,transparent 90%)}
.mg-eyebrow{font:600 12px/1 var(--sans);letter-spacing:.15em;text-transform:uppercase;color:var(--violet)}
.mg-title{font:800 52px/1.02 var(--serif);letter-spacing:-.04em;color:var(--ink)}
.mg-corner-tag{position:absolute;right:56px;top:56px;font:400 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.mg-corner-tag .dt{width:6px;height:6px;background:var(--ink);border-radius:50%}
.mg-watermark{position:absolute;left:56px;bottom:56px;display:flex;align-items:center;gap:12px;font:400 13px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mg-watermark .dot{width:8px;height:8px;border-radius:50%;background:var(--violet)}
.mg-watermark strong{color:var(--ink);font-weight:500}

@keyframes pg-fade-in{0%,100%{opacity:0}8%,92%{opacity:1}}
@keyframes pg03-row-in{0%,100%{opacity:0;transform:translateY(14px)}6%{opacity:0;transform:translateY(14px)}20%{opacity:1;transform:translateY(0)}92%{opacity:1;transform:translateY(0)}}
@keyframes pg03-meter{0%,100%{width:0%}24%{width:0%}52%{width:var(--w)}92%{width:var(--w)}}
@keyframes pg03-flag{0%,100%{opacity:0;transform:scale(.5)}56%{opacity:0;transform:scale(.5)}64%{opacity:1;transform:scale(1.18)}70%{opacity:1;transform:scale(1)}92%{opacity:1;transform:scale(1)}}

body:not(.mg-play) *,body:not(.mg-play) *::before,body:not(.mg-play) *::after{animation-name:none !important}
body.mg-play{animation:mg-page-in 700ms cubic-bezier(.2,.6,.2,1) both}
@keyframes mg-page-in{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:scale(1)}}

.row{display:grid;grid-template-columns:230px 1fr 150px;align-items:center;gap:24px;padding:20px 0;border-bottom:1px solid var(--border-2);animation:pg03-row-in 9s cubic-bezier(.22,1,.36,1) both infinite;opacity:0}
.row:last-child{border-bottom:0}
.rl{font:600 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted-3);margin-bottom:6px}
.rv{font:500 16px/1.2 var(--sans);color:var(--ink-2)}
.meter{height:8px;background:#efefec;border-radius:100px;overflow:hidden}
.meter > div{height:100%;border-radius:100px;animation:pg03-meter 9s cubic-bezier(.22,1,.36,1) both infinite}
.tag{justify-self:end;display:inline-flex;align-items:center;gap:7px;font:500 12px/1 var(--sans);padding:6px 12px;border-radius:100px}
.tag .dot{width:7px;height:7px;border-radius:50%}
.tag.high{background:var(--conf-high-bg);color:var(--conf-high-ink)}
.tag.high .dot{background:var(--conf-high-dot)}
.tag.low{background:var(--conf-low-bg);color:var(--conf-low-ink);animation:pg03-flag 9s cubic-bezier(.34,1.4,.5,1) both infinite}
.tag.low .dot{background:var(--conf-low-dot)}
.tag.fail{background:var(--conf-fail-bg);color:var(--conf-fail-ink);animation:pg03-flag 9s cubic-bezier(.34,1.4,.5,1) both infinite}
.tag.fail .dot{background:var(--conf-fail-dot)}
</style>
</head>
<body class="mg-play">
<div class="mg">
  <div class="mg-grid"></div>

  <div style="position:absolute;top:64px;left:72px;right:72px;animation:pg-fade-in 9s ease both infinite">
    <div class="mg-title" style="margin-top:12px">A confident wrong answer<br>is the worst answer.</div>
  </div>

  <div style="position:absolute;left:130px;right:130px;top:320px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:14px 26px;box-shadow:0 24px 48px -16px rgba(15,15,14,.10)">
    <div class="row" style="animation-delay:0s">
      <div><div class="rl">Supplier</div><div class="rv">Northwind Utilities Ltd</div></div>
      <div class="meter"><div style="background:#22c55e;--w:97%;animation-delay:0s"></div></div>
      <div class="tag high"><span class="dot"></span>97%</div>
    </div>
    <div class="row" style="animation-delay:.12s">
      <div><div class="rl">Consumption</div><div class="rv">14,820 kWh</div></div>
      <div class="meter"><div style="background:#22c55e;--w:95%;animation-delay:.1s"></div></div>
      <div class="tag high"><span class="dot"></span>95%</div>
    </div>
    <div class="row" style="animation-delay:.24s">
      <div><div class="rl">Meter (MPAN)</div><div class="rv">18 9912 4471 220</div></div>
      <div class="meter"><div style="background:#22c55e;--w:92%;animation-delay:.2s"></div></div>
      <div class="tag high"><span class="dot"></span>92%</div>
    </div>
    <div class="row" style="animation-delay:.36s">
      <div><div class="rl">Billing period</div><div class="rv">01 – 31 Jul 2024</div></div>
      <div class="meter"><div style="background:#f59e0b;--w:58%;animation-delay:.3s"></div></div>
      <div class="tag low"><span class="dot"></span>58%</div>
    </div>
    <div class="row" style="animation-delay:.48s">
      <div><div class="rl">VAT reference</div><div class="rv" style="color:var(--muted-2);font-style:italic">unreadable region</div></div>
      <div class="meter"><div style="background:#ef4444;--w:22%;animation-delay:.4s"></div></div>
      <div class="tag fail"><span class="dot"></span>22%</div>
    </div>
  </div>

  <div style="position:absolute;left:130px;bottom:120px;display:flex;align-items:center;gap:14px;animation:pg03-flag 9s ease both infinite;opacity:0">
    <span style="font:500 15px/1.5 var(--sans);color:var(--muted)">
      <strong style="color:var(--ink)">3 of 5</strong> auto-accepted &middot;
      <strong style="color:var(--conf-low-ink)">2 flagged</strong> for review
    </span>
  </div>
</div>
</body>
</html>
